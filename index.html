<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>C64 — RicOS / James Web Emulator MOD</title>
<link rel="stylesheet" href="rico-clone-v2.css">
</head>
<body>
<header>
  <div class="brand">C64</div>
  <nav id="menubar" aria-label="C64 original-style menus"></nav>
  <div class="buildtag">RicOS C64 MOD · TEST 02</div>
</header>
<div class="workarea">
 <aside class="panel" id="left">
   <div class="panel-header"><span class="section-title">CPU</span><button class="tab active" type="button">6510</button></div>
   <div class="cpu"><div class="section-title">Registers</div><div class="regs" id="registers">Initializing CPU…</div></div>
   <div class="controls">
      <button id="startbtn" disabled>▶ Run</button>
      <button id="playpause" disabled>⏸ Pause</button>
      <button id="stepbtn" disabled>Step</button>
      <button id="resetbtn" disabled>Reset</button>
   </div>
   <h2>Disassembly</h2>
   <pre class="codeview" id="disassembly">Waiting for C64 core…</pre>
 </aside>
 <main id="center" class="panel">
   <div id="canvas-holder-label">Commodore 64 · PAL</div>
   <div class="screen-area">
     <div id="c64-holder">
       <canvas id="c64-canvas"></canvas>
       <div id="videooverlay"></div>
       <div id="c64-overlay-onscreen-joystick"><canvas id="c64-overlay-onscreen-joystick-canvas"></canvas></div>
       <div id="c64-onscreen-tabs"><span class="tab" id="c64-onscreen-keyboard-tab">Keyboard</span><span class="tab" id="c64-onscreen-joystick-tab">Joystick</span></div>
       <div id="c64-onscreen-joystick"><canvas id="c64-onscreen-joystick-canvas"></canvas></div>
       <div id="c64-onscreen-keyboard"><canvas id="c64OnscreenKeyboardCanvas"></canvas></div>
     </div>
   </div>
   <div id="center-bottom">
     <div id="notice" role="status" aria-live="polite">Initializing C64…</div>
     <span id="mousecoord" style="display:none"></span>
     <span id="rastertext">Raster 0</span>
   </div>
   <div id="bottomtabs">
     <label>Joystick <select id="joyinfo" title="Joystick port"><option value="2">Port 2</option><option value="1">Port 1</option></select></label>
     <button class="tab" id="fullscreenbtn" title="Fullscreen">Fullscreen</button>
     <span class="muted">Click C64 screen to begin and enable SID audio</span>
   </div>
 </main>
 <aside class="panel" id="right">
   <div class="tabbar" id="righttabs">
     <button class="tab active" data-tab="Memory">Memory</button>
     <button class="tab" data-tab="Charset">Charset</button>
     <button class="tab" data-tab="Sprites">Sprites</button>
     <button class="tab" data-tab="Bitmap">Bitmap</button>
     <button class="tab" data-tab="SID">SID</button>
     <button class="tab" data-tab="Drive">Drive</button>
   </div>
   <div id="right-content">
     <h2 id="right-title">Memory</h2>
     <div class="valuebar" id="mem-address-bar"><label for="memoryaddress">Address $</label><input id="memoryaddress" value="0400" maxlength="4" autocomplete="off"><button id="memorygo">Go</button></div>
     <pre class="hexview" id="righttext">Waiting for C64 core…</pre>
   </div>
 </aside>
</div>
<input class="fileinput" id="fprg" type="file" accept=".prg">
<input class="fileinput" id="fd64" type="file" accept=".d64">
<input class="fileinput" id="fcrt" type="file" accept=".crt">
<script src="js/content.js"></script>
<script src="js/c64.min.js"></script>
<script src="rico-clone-v2.js"></script>
</body></html>
